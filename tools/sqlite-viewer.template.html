<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ontology SQLite viewer (offline)</title>
<style>
  :root {
    --bg: #ffffff; --fg: #242424; --muted: #6b6b6b;
    --line: #e3e3e3; --accent: #0f6cbd; --panel: #faf9f8; --err: #a4262c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1f1f; --fg:#e8e8e8; --muted:#a0a0a0; --line:#3a3a3a; --accent:#68b3f5; --panel:#272727; --err:#f1707b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); font-size: 12px; }
  main { display: flex; height: calc(100vh - 53px); }
  #tables {
    width: 290px; flex: 0 0 290px; overflow: auto;
    border-right: 1px solid var(--line); background: var(--panel);
  }
  #tables button {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    color: inherit; font: inherit; padding: 6px 12px; cursor: pointer;
  }
  #tables button:hover { background: var(--line); }
  #tables button.on { background: var(--accent); color: #fff; }
  #tables .n { float: right; opacity: .65; font-variant-numeric: tabular-nums; }
  #tables h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 14px 12px 4px; font-weight: 600;
  }
  section { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .bar { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
  textarea {
    flex: 1 1 auto; min-height: 62px; font: 13px/1.4 ui-monospace, Consolas, monospace;
    padding: 8px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--fg); resize: vertical;
  }
  button.go {
    border: 0; border-radius: 4px; background: var(--accent); color: #fff;
    padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  select, input[type=file] { font: inherit; padding: 5px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
  #out { flex: 1 1 auto; overflow: auto; padding: 0 0 40px; }
  table { border-collapse: collapse; font: 12.5px/1.4 ui-monospace, Consolas, monospace; width: max-content; min-width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top;
           max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: pre-wrap; }
  th { position: sticky; top: 0; background: var(--panel); font-weight: 600; z-index: 1; }
  tr:hover td { background: var(--panel); }
  .pad { padding: 16px; }
  .err { color: var(--err); white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; }
  .drop {
    margin: 40px auto; max-width: 560px; padding: 40px; text-align: center;
    border: 2px dashed var(--line); border-radius: 8px; color: var(--muted);
  }
  .pager { padding: 8px 16px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); }
  .pager button { border: 1px solid var(--line); background: var(--bg); color: inherit; border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
  #tables .schema {
    margin: 10px 12px 4px; width: calc(100% - 24px); text-align: center;
    border: 1px solid var(--accent); color: var(--accent); background: none;
    border-radius: 4px; padding: 6px; font-weight: 600;
  }
  #tables .schema:hover { background: var(--accent); color: #fff; }
  svg.er { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.er text { font: 11px ui-monospace, Consolas, monospace; fill: var(--fg); }
  svg.er .tname { font-weight: 700; font-size: 12.5px; }
  svg.er .col { fill: var(--muted); }
  svg.er .pk { fill: var(--fg); font-weight: 700; }
  svg.er rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; rx: 5; }
  svg.er rect.hdr { fill: var(--accent); rx: 5; }
  svg.er text.hdrt { fill: #fff; font-weight: 700; font-size: 12.5px; }
  svg.er path.fk { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .75; }
  svg.er text.fklabel { font-size: 10px; fill: var(--muted); }
  svg.er g.node { cursor: move; }
</style>
</head>
<body>
<header>
  <h1>Ontology SQLite viewer</h1>
  <input type="file" id="file" accept=".sqlite,.db,.sqlite3">
  <span class="muted" id="info">Runs entirely offline — the file is read in this page and never uploaded.</span>
</header>

<main>
  <div id="tables"></div>
  <section>
    <div class="bar">
      <textarea id="sql" spellcheck="false" placeholder="SELECT * FROM concepts LIMIT 50"></textarea>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="go" id="run">Run  (Ctrl+Enter)</button>
        <select id="canned"><option value="">Canned queries…</option></select>
      </div>
    </div>
    <div id="out">
      <div class="drop" id="drop">Drop a <b>.sqlite</b> file here, or use the picker above.</div>
    </div>
    <div class="pager" id="pager" hidden>
      <button id="prev">‹ Prev</button><span class="muted" id="range"></span><button id="next">Next ›</button>
    </div>
  </section>
</main>

<script>__SQLJS__</script>
<script>
const WASM_B64 = "__WASM_B64__";

/* Canned queries for the ontology editor's schema. Harmless against other
   databases — they simply error if the tables are absent. */
const CANNED = [
  ['Concepts per class', `SELECT COALESCE(cl.label,'(no class)') AS class, COUNT(*) AS concepts
FROM concepts c LEFT JOIN classes cl ON cl.id = c.class_id
GROUP BY 1 ORDER BY concepts DESC`],
  ['Top concepts (no broader)', `SELECT c.id, c.pref_label, cl.label AS class
FROM concepts c LEFT JOIN classes cl ON cl.id = c.class_id
WHERE NOT EXISTS (SELECT 1 FROM broader b WHERE b.concept_id = c.id)
ORDER BY c.pref_label`],
  ['Concepts with several parents', `SELECT c.pref_label, COUNT(*) AS parents
FROM broader b JOIN concepts c ON c.id = b.concept_id
GROUP BY b.concept_id HAVING parents > 1 ORDER BY parents DESC, c.pref_label`],
  ['Publish / provenance metadata', `SELECT key, value FROM import_metadata ORDER BY key`],
  ['Change journal (latest 100)', `SELECT id, changed_at, author, op, entity, entity_uri
FROM changes ORDER BY id DESC LIMIT 100`],
  ['Label types in use', `SELECT COALESCE(p.label, l.label_property) AS type, COUNT(*) AS n
FROM labels l LEFT JOIN properties p ON p.uri = l.label_property
GROUP BY 1 ORDER BY n DESC`],
  ['Metadata fields in use', `SELECT COALESCE(p.label, a.predicate_uri) AS field, COUNT(*) AS n
FROM annotations a LEFT JOIN properties p ON p.uri = a.predicate_uri
GROUP BY 1 ORDER BY n DESC`],
  ['Relationships both directions', `SELECT COALESCE(p.label,p.uri) AS type, l.direction, COUNT(*) AS n
FROM v_concept_links l JOIN properties p ON p.id = l.property_id
GROUP BY 1,2 ORDER BY n DESC`],
  ['Relationships, readable (source → type → target)', `SELECT s.pref_label AS source,
       COALESCE(p.label, p.uri) AS relationship,
       t.pref_label AS target
FROM relationships r
JOIN concepts   s ON s.id = r.source_concept_id
JOIN properties p ON p.id = r.property_id
JOIN concepts   t ON t.id = r.target_concept_id
ORDER BY source, relationship, target
LIMIT 500`],
  ['One concept, everything about it', `-- Change the name on the next line.
WITH me AS (SELECT id, pref_label FROM concepts WHERE pref_label = 'Income tax')
SELECT 'parent'       AS kind, p.pref_label AS value, '' AS detail
  FROM broader b JOIN me ON me.id = b.concept_id JOIN concepts p ON p.id = b.parent_concept_id
UNION ALL SELECT 'child', c.pref_label, ''
  FROM broader b JOIN me ON me.id = b.parent_concept_id JOIN concepts c ON c.id = b.concept_id
UNION ALL SELECT 'label', l.literal_form, COALESCE(pr.label, l.label_property)
  FROM labels l JOIN me ON me.id = l.concept_id LEFT JOIN properties pr ON pr.uri = l.label_property
UNION ALL SELECT 'metadata', a.value, COALESCE(pr.label, a.predicate_uri)
  FROM annotations a JOIN me ON me.id = a.concept_id LEFT JOIN properties pr ON pr.uri = a.predicate_uri
UNION ALL SELECT 'related', o.pref_label, COALESCE(pr.label, pr.uri)
  FROM v_concept_links v JOIN me ON me.id = v.concept_id
  JOIN properties pr ON pr.id = v.property_id JOIN concepts o ON o.id = v.other_concept_id`],
  ['Integrity: links with a missing end', `SELECT COUNT(*) AS broken FROM relationships r
LEFT JOIN concepts s ON s.id = r.source_concept_id
LEFT JOIN concepts t ON t.id = r.target_concept_id
WHERE s.id IS NULL OR t.id IS NULL`]
];

let SQL = null, db = null, current = null, offset = 0;
const PAGE = 200;
const $ = (id) => document.getElementById(id);

function bytesFromBase64(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function ready() {
  if (!SQL) SQL = await initSqlJs({ wasmBinary: bytesFromBase64(WASM_B64) });
  return SQL;
}

function esc(v) {
  if (v === null || v === undefined) return '<span class="muted">NULL</span>';
  if (v instanceof Uint8Array) return '<span class="muted">' + v.length + ' bytes</span>';
  return String(v).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function render(res) {
  if (!res || !res.length) { $('out').innerHTML = '<div class="pad muted">No rows.</div>'; return; }
  const { columns, values } = res[0];
  const head = '<tr>' + columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
  const body = values.map(r => '<tr>' + r.map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>').join('');
  $('out').innerHTML = '<table>' + head + body + '</table>';
}

function showError(e) {
  $('out').innerHTML = '<div class="pad err">' + esc(e && e.message ? e.message : String(e)) + '</div>';
}

function listTables() {
  const q = (s) => { const r = db.exec(s); return r.length ? r[0].values : []; };
  const tables = q("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
  const views = q("SELECT name FROM sqlite_master WHERE type='view' ORDER BY name");
  const count = (n) => { try { return db.exec('SELECT COUNT(*) FROM "' + n + '"')[0].values[0][0]; } catch { return '?'; } };
  const btn = (n) => '<button data-t="' + esc(n) + '">' + esc(n) + '<span class="n">' + count(n) + '</span></button>';
  $('tables').innerHTML =
    '<button class="schema" id="schemaBtn">Schema diagram</button>' +
    '<h2>Tables</h2>' + tables.map(r => btn(r[0])).join('') +
    (views.length ? '<h2>Views</h2>' + views.map(r => btn(r[0])).join('') : '');
  $('tables').querySelectorAll('button[data-t]').forEach(b =>
    b.onclick = () => { current = b.dataset.t; offset = 0; browse(); });
  $('schemaBtn').onclick = drawSchema;
}

function browse() {
  if (!current) return;
  $('tables').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === current));
  try {
    render(db.exec('SELECT * FROM "' + current + '" LIMIT ' + PAGE + ' OFFSET ' + offset));
    const total = db.exec('SELECT COUNT(*) FROM "' + current + '"')[0].values[0][0];
    $('pager').hidden = false;
    $('range').textContent = current + ' — rows ' + (offset + 1) + '–' + Math.min(offset + PAGE, total) + ' of ' + total;
    $('prev').disabled = offset === 0;
    $('next').disabled = offset + PAGE >= total;
  } catch (e) { showError(e); }
}

/* ---------------------------------------------------------------- schema --
   An ER diagram of the database itself: tables as boxes listing their columns,
   foreign keys as lines between them. Everything comes from SQLite's own
   PRAGMAs, so it works on any database, not just this project's.            */

function readSchema() {
  const q = (s) => { const r = db.exec(s); return r.length ? r[0].values : []; };
  const names = q("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")
    .map(r => String(r[0]));

  const nodes = names.map(name => {
    const cols = q('PRAGMA table_info("' + name + '")')
      .map(r => ({ name: String(r[1]), type: String(r[2] || ''), pk: Number(r[5]) > 0 }));
    // Box is sized to its content so nothing overlaps once laid out.
    const widest = Math.max(name.length + 2, ...cols.map(c => (c.name + ' ' + c.type).length));
    return {
      name, cols,
      w: Math.min(300, Math.max(130, widest * 6.6 + 20)),
      h: 24 + cols.length * 14 + 8,
      x: 0, y: 0, vx: 0, vy: 0
    };
  });

  const byName = new Map(nodes.map(n => [n.name, n]));
  const links = [];
  for (const n of nodes) {
    for (const r of q('PRAGMA foreign_key_list("' + n.name + '")')) {
      const target = byName.get(String(r[2]));
      if (target) links.push({ s: n, t: target, label: String(r[3] || '') });
    }
  }
  return { nodes, links };
}

/** Small force layout: links pull, boxes push apart, then overlaps resolved. */
function layout(nodes, links) {
  const W = 1200, H = 820;
  nodes.forEach((n, i) => {
    const a = (i / nodes.length) * Math.PI * 2;
    n.x = W / 2 + Math.cos(a) * 300;
    n.y = H / 2 + Math.sin(a) * 240;
  });

  for (let step = 0; step < 400; step++) {
    for (const n of nodes) { n.vx = 0; n.vy = 0; }

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy) || 0.01;
        const want = (a.w + b.w) / 2 + 70;
        if (d < want) {
          const push = (want - d) / d * 0.5;
          dx *= push; dy *= push;
          a.vx -= dx; a.vy -= dy; b.vx += dx; b.vy += dy;
        }
      }
    }
    for (const l of links) {
      const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const want = (l.s.w + l.t.w) / 2 + 110;
      const pull = (d - want) / d * 0.06;
      l.s.vx += dx * pull; l.s.vy += dy * pull;
      l.t.vx -= dx * pull; l.t.vy -= dy * pull;
    }
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.004;
      n.vy += (H / 2 - n.y) * 0.004;
      n.x += Math.max(-20, Math.min(20, n.vx));
      n.y += Math.max(-20, Math.min(20, n.vy));
    }
  }
}

/**
 * Edge between two box borders, curved so lines do not cut through boxes.
 * `bend` fans apart the several keys that can join the same pair of tables
 * (properties → classes is both domain_class_id and range_class_id), which
 * otherwise draw on top of each other with unreadable overlapping labels.
 */
function edgePath(s, t, bend) {
  const dx = t.x - s.x, dy = t.y - s.y;
  const clip = (n, ux, uy) => {
    const hw = n.w / 2 + 4, hh = n.h / 2 + 4;
    const scale = Math.min(hw / (Math.abs(ux) || 1e-6), hh / (Math.abs(uy) || 1e-6));
    return [n.x + ux * scale, n.y + uy * scale];
  };
  const len = Math.hypot(dx, dy) || 1;
  const [x1, y1] = clip(s, dx / len, dy / len);
  const [x2, y2] = clip(t, -dx / len, -dy / len);
  const curve = 0.12 + (bend || 0) * 0.22;
  const mx = (x1 + x2) / 2 + (y2 - y1) * curve;
  const my = (y1 + y2) / 2 - (x2 - x1) * curve;
  // Label sits ON the curve (a quadratic's midpoint), not on the chord.
  const lx = (x1 + 2 * mx + x2) / 4;
  const ly = (y1 + 2 * my + y2) / 4;
  return { d: `M${x1},${y1} Q${mx},${my} ${x2},${y2}`, mx: lx, my: ly - 3 };
}

/** Fan index for each link, so repeated pairs curve differently. */
function assignBends(links) {
  const seen = new Map();
  for (const l of links) {
    const key = [l.s.name, l.t.name].sort().join('␀');
    const n = seen.get(key) || 0;
    seen.set(key, n + 1);
    // 0, +1, -1, +2, -2 … spreads them either side of the direct line.
    l.bend = n === 0 ? 0 : (n % 2 ? Math.ceil(n / 2) : -Math.ceil(n / 2));
  }
}

function drawSchema() {
  if (!db) return;
  $('pager').hidden = true;
  try {
    const { nodes, links } = readSchema();
    if (!nodes.length) { $('out').innerHTML = '<div class="pad muted">No tables.</div>'; return; }
    assignBends(links);
    layout(nodes, links);

    const pad = 60;
    const minX = Math.min(...nodes.map(n => n.x - n.w / 2)) - pad;
    const minY = Math.min(...nodes.map(n => n.y - n.h / 2)) - pad;
    const maxX = Math.max(...nodes.map(n => n.x + n.w / 2)) + pad;
    const maxY = Math.max(...nodes.map(n => n.y + n.h / 2)) + pad;

    const edges = links.map(l => {
      const { d, mx, my } = edgePath(l.s, l.t, l.bend);
      return `<path class="fk" d="${d}" marker-end="url(#arrow)"></path>` +
             `<text class="fklabel" x="${mx}" y="${my}" text-anchor="middle">${esc(l.label)}</text>`;
    }).join('');

    const boxes = nodes.map((n, i) => {
      const x = n.x - n.w / 2, y = n.y - n.h / 2;
      const cols = n.cols.map((c, k) =>
        `<text class="${c.pk ? 'pk' : 'col'}" x="${x + 9}" y="${y + 38 + k * 14}">` +
        `${esc(c.pk ? '• ' + c.name : c.name)}` +
        `<tspan class="col" dx="6">${esc(c.type.toLowerCase())}</tspan></text>`).join('');
      return `<g class="node" data-i="${i}">` +
             `<rect class="box" x="${x}" y="${y}" width="${n.w}" height="${n.h}"></rect>` +
             `<rect class="hdr" x="${x}" y="${y}" width="${n.w}" height="22"></rect>` +
             `<text class="hdrt" x="${x + 9}" y="${y + 15}">${esc(n.name)}</text>` +
             cols + `</g>`;
    }).join('');

    $('out').innerHTML =
      `<svg class="er" viewBox="${minX} ${minY} ${maxX - minX} ${maxY - minY}">` +
      `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">` +
      `<path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity=".55"/></marker></defs>` +
      `<g id="erRoot">${edges}${boxes}</g></svg>`;

    // Drag a table to tidy the layout by hand; edges follow.
    const svg = $('out').querySelector('svg.er');
    let dragging = null, start = null;
    svg.addEventListener('pointerdown', (e) => {
      const g = e.target.closest('g.node');
      if (!g) return;
      dragging = nodes[Number(g.dataset.i)];
      const p = svgPoint(svg, e);
      start = { px: p.x, py: p.y, x: dragging.x, y: dragging.y };
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const p = svgPoint(svg, e);
      dragging.x = start.x + (p.x - start.px);
      dragging.y = start.y + (p.y - start.py);
      redraw(svg, nodes, links);
    });
    svg.addEventListener('pointerup', () => { dragging = null; });
  } catch (e) { showError(e); }
}

function svgPoint(svg, e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function redraw(svg, nodes, links) {
  const gs = svg.querySelectorAll('g.node');
  nodes.forEach((n, i) => {
    const g = gs[i];
    const x = n.x - n.w / 2, y = n.y - n.h / 2;
    const [box, hdr] = g.querySelectorAll('rect');
    box.setAttribute('x', x); box.setAttribute('y', y);
    hdr.setAttribute('x', x); hdr.setAttribute('y', y);
    const texts = g.querySelectorAll('text');
    texts[0].setAttribute('x', x + 9); texts[0].setAttribute('y', y + 15);
    for (let k = 1; k < texts.length; k++) {
      texts[k].setAttribute('x', x + 9);
      texts[k].setAttribute('y', y + 38 + (k - 1) * 14);
    }
  });
  const paths = svg.querySelectorAll('path.fk');
  const labels = svg.querySelectorAll('text.fklabel');
  links.forEach((l, i) => {
    const { d, mx, my } = edgePath(l.s, l.t, l.bend);
    paths[i].setAttribute('d', d);
    labels[i].setAttribute('x', mx); labels[i].setAttribute('y', my);
  });
}

function run() {
  const sql = $('sql').value.trim();
  if (!sql || !db) return;
  $('pager').hidden = true;
  try { render(db.exec(sql)); } catch (e) { showError(e); }
}

async function open(file) {
  try {
    $('out').innerHTML = '<div class="pad muted">Opening ' + esc(file.name) + '…</div>';
    await ready();
    const buf = await file.arrayBuffer();
    if (db) db.close();
    db = new SQL.Database(new Uint8Array(buf));
    $('info').textContent = file.name + ' — ' + (buf.byteLength / 1048576).toFixed(1) + ' MB, read locally';
    listTables();
    $('out').innerHTML = '<div class="pad muted">Pick a table on the left, or run a query.</div>';
    $('pager').hidden = true;
  } catch (e) { showError(e); }
}

CANNED.forEach(([label, sql], i) => {
  const o = document.createElement('option');
  o.value = String(i); o.textContent = label;
  $('canned').appendChild(o);
});
$('canned').onchange = (e) => {
  const i = e.target.value;
  if (i === '') return;
  $('sql').value = CANNED[Number(i)][1];
  e.target.value = '';
  run();
};

$('file').onchange = (e) => { if (e.target.files[0]) open(e.target.files[0]); };
$('run').onclick = run;
$('sql').onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } };
$('prev').onclick = () => { offset = Math.max(0, offset - PAGE); browse(); };
$('next').onclick = () => { offset += PAGE; browse(); };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) open(e.dataTransfer.files[0]);
});
</script>
</body>
